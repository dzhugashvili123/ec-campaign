<header>
    <img [src]="assetPath + '/logo.png'" class="logo">

    <div class="btn-group">

        <!-- EC CAMPAIGN -->
        <button *ngIf="isLoggedIn" class="btn btn-pill" (click)="navigateToCampaign()"
            [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
            EC CAMPAIGN
        </button>

        <button *ngIf="!isLoggedIn" class="login-btn" (click)="login()"
            [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text}">
            <span class="btn-icon">
                <i class="bi bi-box-arrow-in-right"></i>
            </span>
            <span class="btn-text">
                Login
            </span>
        </button>

        <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()"
            [ngStyle]="{'background-color': party.theme.color, 'color': party.theme.text}">
            <span class="btn-icon">
                <i class="bi bi-box-arrow-left"></i>
            </span>
            <span class="btn-text">
                Logout
            </span>
        </button>
    </div>

</header>

<div class="reports-wrapper">
    <!-- Compact Header & Summary Box -->
    <div class="compact-header-bar mb-3">
        <div class="title-area">
            <h1 class="page-title-compact">
                <i class="bi bi-graph-up-arrow"></i> Analytics
            </h1>
            <div class="stats-ribbon" *ngIf="reportData && reportData.length > 0">
                <span class="stat-badge total">
                    <i class="bi bi-people-fill"></i> {{ reportData.length }} Records
                </span>
                <span class="stat-separator"></span>
                <span class="stat-badge date">
                    <i class="bi bi-calendar3"></i> {{ startDate | date:'shortDate' }} - {{ endDate | date:'shortDate'
                    }}
                </span>
            </div>
        </div>

        <!-- Inline Filters -->
        <div class="compact-filters">
            <div class="filter-group">
                <div class="input-with-icon">
                    <i class="bi bi-calendar-event" (click)="openDatePicker(startDateNativeInput)"></i>
                    <input type="text" [value]="formatDateForDisplay(startDate)" class="form-control-compact"
                        placeholder="DD/MM/YYYY" readonly (click)="openDatePicker(startDateNativeInput)">
                    <input #startDateNativeInput type="date" [(ngModel)]="startDate" class="native-date-input"
                        aria-label="Start date">
                </div>
                <span class="to-text">to</span>
                <div class="input-with-icon">
                    <i class="bi bi-calendar-check" (click)="openDatePicker(endDateNativeInput)"></i>
                    <input type="text" [value]="formatDateForDisplay(endDate)" class="form-control-compact"
                        placeholder="DD/MM/YYYY" readonly (click)="openDatePicker(endDateNativeInput)">
                    <input #endDateNativeInput type="date" [(ngModel)]="endDate" class="native-date-input"
                        aria-label="End date">
                </div>
            </div>
            <button (click)="onSubmit()" [disabled]="isLoading" class="btn-compact-submit"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                <i class="bi bi-search" *ngIf="!isLoading"></i>
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
                {{ isLoading ? '' : 'View' }}
            </button>
        </div>
    </div>

    <!-- RESULTS SECTION -->
    <div class="results-container-compact" *ngIf="reportData && reportData.length > 0">
        <div class="results-header-compact">
            <h3>Report Details</h3>
            <div class="action-buttons-compact">
                <button class="btn-download-compact" (click)="downloadReport()">
                    <i class="bi bi-download"></i> Download
                </button>
                <button class="btn-clear-compact" (click)="reportData = []">
                    <i class="bi bi-x-circle"></i> Clear
                </button>
            </div>
        </div>
        <div class="table-responsive compact-table-wrap">
            <table class="table custom-table-compact">
                <thead>
                    <tr>
                        <th *ngFor="let col of displayedColumns">{{ col.label }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of reportData">
                        <td *ngFor="let col of displayedColumns">
                            <ng-container [ngSwitch]="col.key">
                                <span *ngSwitchCase="'policyNumber'" class="phone-link-compact">
                                    <i class="bi bi-phone"></i> {{ row[col.key] }}
                                </span>
                                <span *ngSwitchCase="'visitDate'">
                                    {{ row[col.key] | date:'mediumDate' }}
                                </span>
                                <span *ngSwitchDefault>
                                    {{ row[col.key] }}
                                </span>
                            </ng-container>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Empty State Compact -->
    <div *ngIf="!isLoading && reportData.length === 0" class="no-data-compact">
        <i class="bi bi-clipboard-data"></i>
        <p>Enter dates above to see analytics</p>
    </div>
</div>
