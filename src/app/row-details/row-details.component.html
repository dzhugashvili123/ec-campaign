<div class="row-form-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Edit Record: {{ rowData.firstName || rowData.firstName || 'Details' }}</h2>
        <button type="button" class="btn-cancel" (click)="cancel()">Back to List</button>
    </div>

    <form #editForm="ngForm" (ngSubmit)="saveChanges(editForm)">
        <div class="form-grid">
            <div class="form-group" *ngFor="let field of schema">
                <label>{{ formatKey(field.key) }}</label>

                <!-- DATE -->
                <input *ngIf="field.fieldType === 'date'" type="text" [(ngModel)]="rowData[field.key]"
                    [name]="field.key"
                    [placeholder]="'Enter ' + formatKey(field.key) + (field.format ? ' (' + field.format + ')' : ' (DD/MM/YYYY)')">

                <!-- ZIP -->
                <input *ngIf="field.fieldType === 'zip'" type="text" pattern="[0-9]*" inputmode="numeric"
                    [(ngModel)]="rowData[field.key]" [name]="field.key" [placeholder]="'Enter ' + formatKey(field.key)">

                <!-- AMOUNT -->
                <input *ngIf="field.fieldType === 'amount'" type="text" [(ngModel)]="rowData[field.key]"
                    [name]="field.key"
                    [placeholder]="'Enter ' + formatKey(field.key) + (field.format ? ' (e.g. ' + field.format + ')' : '')">

                <!-- DROPDOWN -->
                <select *ngIf="field.fieldType === 'dropdown'" [(ngModel)]="rowData[field.key]" [name]="field.key"
                    class="form-control">
                    <option value="" disabled>Select {{ formatKey(field.key) }}</option>
                    <option *ngFor="let opt of field.allowedValues" [value]="opt.value">
                        {{ opt.label }}
                    </option>
                </select>

                <!-- TEXT (Default) -->
                <input *ngIf="field.fieldType === 'text' || !field.fieldType" type="text"
                    [(ngModel)]="rowData[field.key]" [name]="field.key" [placeholder]="'Enter ' + formatKey(field.key)">
            </div>
        </div>

        <div class="form-actions mt-4">
            <button type="submit" class="btn-submit" [disabled]="editForm.invalid || isSaving"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                {{ isSaving ? 'Saving...' : 'Save Changes' }}
            </button>
        </div>
    </form>
</div>
