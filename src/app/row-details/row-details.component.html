<div class="row-form-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Edit Record: {{ rowData.firstName || rowData.firstName || 'Details' }}</h2>
        <button type="button" class="btn-cancel" (click)="cancel()">Back to List</button>
    </div>

    <form #editForm="ngForm" (ngSubmit)="saveChanges(editForm)">
        <div class="form-grid">
            <div class="form-group" *ngFor="let field of schema">
                <label>{{ formatKey(field.key) }}</label>

                <!-- BOOLEAN/RADIO FIELDS (Y/N) -->
                <div class="radio-group" *ngIf="rowData[field.key] === 'Y' || rowData[field.key] === 'N'">
                    <label class="radio-option">
                        <input type="radio" [name]="field.key" [(ngModel)]="rowData[field.key]" value="Y"> Yes
                    </label>
                    <label class="radio-option">
                        <input type="radio" [name]="field.key" [(ngModel)]="rowData[field.key]" value="N"> No
                    </label>
                </div>

                <!-- DATE FIELDS -->
                <input type="text"
                    *ngIf="field.key.toLowerCase().includes('date') && rowData[field.key] !== 'Y' && rowData[field.key] !== 'N'"
                    [(ngModel)]="rowData[field.key]" [name]="field.key" placeholder="YYYY-MM-DD">

                <!-- NUMBER FIELDS -->
                <input type="number"
                    *ngIf="field.key.toLowerCase().includes('amount') || field.key.toLowerCase().includes('zip')"
                    [(ngModel)]="rowData[field.key]" [name]="field.key" [placeholder]="'Enter ' + formatKey(field.key)">

                <!-- SELECT LANGUAGE -->
                <select *ngIf="field.key === 'selectLanguage'" [(ngModel)]="rowData.selectLanguage"
                    name="selectLanguage" class="form-control">
                    <option value="E">English</option>
                    <option value="T">Telugu</option>
                </select>

                <!-- DEFAULT TEXT FIELDS -->
                <input type="text"
                    *ngIf="!field.key.toLowerCase().includes('date') && !field.key.toLowerCase().includes('amount') && !field.key.toLowerCase().includes('zip') && field.key !== 'selectLanguage' && rowData[field.key] !== 'Y' && rowData[field.key] !== 'N'"
                    [(ngModel)]="rowData[field.key]" [name]="field.key" [placeholder]="'Enter ' + formatKey(field.key)">
            </div>
        </div>

        <div class="form-actions mt-4">
            <button type="submit" class="btn-submit" [disabled]="editForm.invalid || isSaving"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                {{ isSaving ? 'Saving...' : 'Save Changes' }}
            </button>
        </div>
    </form>
</div>
