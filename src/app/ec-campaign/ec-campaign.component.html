<header>
    <img [src]="assetPath + '/logo.png'" class="logo">

    <div class="btn-group">

        <!-- EC Campaign -->
        <button *ngIf="isLoggedIn" class="btn btn-pill" (click)="navigateToUpload()"
            [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
            EC CAMPAIGN
        </button>
        <ng-container *ngIf="isLoggedIn">
            <button class="btn btn-pill" (click)="viewReports();"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                Reports
            </button>
        </ng-container>
        <ng-container *ngIf="party.theme.joinUrl">
            <!-- JOIN button -->
            <button class="btn btn-pill" (click)="openLink(party.theme.joinUrl)"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                {{ party.theme.joinLabel }}
            </button>

            <!-- DONATION button -->
            <button class="btn btn-pill" (click)="openLink(party.theme.donateUrl)"
                [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                MAKE A DONATION
            </button>
        </ng-container>

        <button *ngIf="!isLoggedIn" class="login-btn" (click)="login()"
            [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text}">
            <span class="btn-icon">
                <i class="bi bi-box-arrow-in-right"></i>
            </span>
            <span class="btn-text">
                Login
            </span>
        </button>

        <button *ngIf="isLoggedIn" class="logout-btn" (click)="logout()"
            [ngStyle]="{'background-color': party.theme.color, 'color': party.theme.text}">
            <span class="btn-icon">
                <i class="bi bi-box-arrow-left"></i>
            </span>
            <span class="btn-text">
                Logout
            </span>
        </button>
    </div>

</header>

<div class="carousel">
    <div class="carousel" (mouseenter)="pauseAutoSlide()" (mouseleave)="resumeAutoSlide()">

        <div class="slides" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
            (mousedown)="startDrag($event)" (mousemove)="onDrag($event)" (mouseup)="endDrag()" (mouseleave)="endDrag()"
            (touchstart)="startDrag($event)" (touchmove)="onDrag($event)" (touchend)="endDrag()">

            <img [src]="assetPath + '/Img1.jpg'" alt="Slide 1">
            <img [src]="assetPath + '/Img2.jpg'" alt="Slide 2">
            <img [src]="assetPath + '/Img3.jpg'" alt="Slide 3">
            <img [src]="assetPath + '/Img4.jpg'" alt="Slide 4">
        </div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div class="overlay-content" *ngIf="currentView === 'login'">
        <div class="upload-card">
            <h2>Login</h2>

            <form (ngSubmit)="handleLogin()">
                <div class="mb-3">
                    <label class="form-label">Username / Email</label>
                    <input type="text" [(ngModel)]="username" name="username" class="form-control" required>
                </div>

                <div class="mb-3 position-relative">
                    <label class="form-label">Password</label>
                    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                        class="form-control" required>

                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="togglePassword()"
                        style="position:absolute; top:38px; right:10px; cursor:pointer;">
                    </i>
                </div>

                <div *ngIf="loginError" class="text-danger">{{ loginError }}</div>

                <div class="button-group">
                    <button type="button" class="btn-cancel" (click)="resetToHome()">
                        Cancel
                    </button>

                    <button type="submit" class="btn-submit">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DROPDOWN OVERLAY -->
    <div class="overlay-content" *ngIf="currentView === 'dropdown'">
        <div class="upload-card">
            <h2>Select List</h2>

            <form (ngSubmit)="handleListSelection()">
                <select class="form-control" [(ngModel)]="selectedList" name="selectedList" required>
                    <option value="" disabled>Select one</option>
                    <option *ngFor="let campaign of campaigns" [value]="campaign.id">
                        {{ campaign.campaignname }}
                    </option>
                </select>

                <div *ngIf="selectionError" class="text-danger">{{ selectionError }}</div>

                <div class="button-group">
                    <button type="button" class="btn-cancel" (click)="resetToHome()">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-pill" (click)="openUploadScreen()"
                        [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                        Upload New File
                    </button>

                    <button type="submit" class="btn-submit">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLE OVERLAY -->
    <div class="overlay-content table-view-container" *ngIf="currentView === 'table'">
        <div class="upload-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="m-0">Selected List</h2>
                <button type="button" class="btn btn-sm btn-pill" (click)="openAddModal()"
                    [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                    <i class="bi bi-plus-lg"></i> Add
                </button>
            </div>

            <form (ngSubmit)="submitSelectedRows()">
                <div class="table-scroll-container">
                    <table border="1" width="100%">
                        <thead>
                            <tr>
                                <th><input type="checkbox" (change)="toggleSelectAll($event)"></th>
                                <th>Action</th>
                                <th>#</th>
                                <th *ngFor="let field of currentCampaignSchema">
                                    {{ formatKey(field.key) }}
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of csvData; let i = index">
                                <td>
                                    <input type="checkbox" [(ngModel)]="row.selected" name="selected{{i}}">
                                </td>
                                <td>
                                    <button type="button" class="btn details-btn" (click)="openDetails(row)"
                                        [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text}">
                                        Details
                                    </button>
                                </td>
                                <td>{{ i + 1 }}</td>
                                <td *ngFor="let field of currentCampaignSchema">
                                    {{ row[field.key] }}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-cancel" (click)="resetToHomepage()">
                        Cancel
                    </button>

                    <button type="submit" class="btn-submit"
                        [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                        Run Campaign
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- UPLOAD OVERLAY -->
    <div class="overlay-content" *ngIf="currentView === 'upload'">
        <div class="upload-card">
            <h2>Upload Campaign File</h2>

            <div class="mb-3">
                <label class="form-label">Select Campaign</label>
                <div class="campaign-select-row">
                    <select class="form-select" [(ngModel)]="selectedCampaign" name="selectedCampaign">
                        <option value="" disabled>Select a campaign</option>
                        <option *ngFor="let campaign of campaigns" [value]="campaign.campaignname">
                            {{ campaign.campaignname }}
                        </option>
                    </select>
                    <button type="button" class="btn-download-icon" (click)="handleDownloadSample()"
                        title="Download Sample" [disabled]="!selectedCampaign">
                        <i class="bi bi-download"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Choose File</label>
                <input type="file" class="form-control"
                    accept=".csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                    (change)="handleFileChange($event)" [disabled]="!selectedCampaign">
            </div>

            <div class="button-group pt-3">
                <button type="button" class="btn-cancel" (click)="resetToHome()">Cancel</button>
                <button type="button" class="btn btn-pill" (click)="openFileListScreen()" [disabled]="!selectedCampaign"
                    [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                    Select from List
                </button>
                <button type="button" class="btn-submit" (click)="handleApiCall()"
                    [disabled]="!isValidated || isUploading || !selectedCampaign"
                    [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                    Run Campaign
                </button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION DOTS -->
    <ng-container *ngIf="party.current !== 'adv'">
        <div class="navigation">
            <span class="bar" *ngFor="let s of [0,1,2,3]; let i = index" [class.active]="currentSlide === i"
                (click)="goToSlide(i)">
            </span>
        </div>
    </ng-container>

    <!-- ADD RECORD MODAL -->
    <div class="modal-backdrop" *ngIf="showAddModal">
        <div class="modal-card">
            <h3>Add New Record</h3>
            <div style="max-height: 400px; overflow-y: auto; padding-right: 5px;">
                <div class="mb-3" *ngFor="let field of currentCampaignSchema">
                    <label class="form-label">{{ formatKey(field.key) }}</label>

                    <!-- DATE -->
                    <input *ngIf="field.fieldType === 'date'" type="text" [(ngModel)]="newRecord[field.key]"
                        class="form-control" [name]="field.key"
                        [placeholder]="'Enter ' + formatKey(field.key) + (field.format ? ' (' + field.format + ')' : '')">

                    <!-- ZIP -->
                    <input *ngIf="field.fieldType === 'zip'" type="text" pattern="[0-9]*" inputmode="numeric"
                        [(ngModel)]="newRecord[field.key]" class="form-control" [name]="field.key"
                        [placeholder]="'Enter ' + formatKey(field.key)">

                    <!-- AMOUNT -->
                    <input *ngIf="field.fieldType === 'amount'" type="text" [(ngModel)]="newRecord[field.key]"
                        class="form-control" [name]="field.key"
                        [placeholder]="'Enter ' + formatKey(field.key) + (field.format ? ' (e.g. ' + field.format + ')' : '')">

                    <!-- DROPDOWN -->
                    <select *ngIf="field.fieldType === 'dropdown'" [(ngModel)]="newRecord[field.key]"
                        class="form-select" [name]="field.key">
                        <option value="" disabled>Select {{ formatKey(field.key) }}</option>
                        <option *ngFor="let opt of field.allowedValues" [value]="opt.value">
                            {{ opt.label }}
                        </option>
                    </select>

                    <!-- TEXT (Default) -->
                    <input *ngIf="field.fieldType === 'text' || !field.fieldType" type="text"
                        [(ngModel)]="newRecord[field.key]" class="form-control" [name]="field.key"
                        [placeholder]="'Enter ' + formatKey(field.key)">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-cancel" (click)="closeAddModal()">Cancel</button>
                <button type="button" class="btn-submit" (click)="addNewRecord()"
                    [ngStyle]="{ 'background-color': party.theme.color, 'color': party.theme.text }">
                    Save Record
                </button>
            </div>
        </div>
    </div>
</div>
